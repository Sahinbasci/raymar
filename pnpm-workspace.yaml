# Packages allowed to run install scripts.
#   unrs-resolver — native module resolver used by eslint-config-next's
#                   TypeScript import resolver. Without its postinstall the
#                   prebuilt binding is not linked and `pnpm lint` fails.
allowBuilds:
  unrs-resolver: true

# Dependency pins applied to the whole tree.
#
# `pnpm audit` flagged two packages that reach the project only through build
# and lint tooling — nanoid (via next and @tailwindcss/postcss) and js-yaml
# (via eslint). Neither ships in the static export, but an audit run on the
# delivered repository should come back clean, so both are pinned forward to
# their patched releases. Same major version in each case.
overrides:
  nanoid: '>=3.3.18'
  js-yaml: '>=4.3.2'
  # brace-expansion ships in two majors here (minimatch 3 -> 1.x, minimatch 10
  # -> 5.x), so the pin is per line; a single range would break one consumer.
  'brace-expansion@^1': '^1.1.21'
  'brace-expansion@^5': '^5.0.12'
  source-map-js: '^1.2.2'
  sharp: '>=0.35.5'
